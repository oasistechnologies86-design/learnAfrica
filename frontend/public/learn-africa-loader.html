<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f6">
  <title>LearnAfrica Loader Preview</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f8f6;
      --ink: #10241a;
      --muted: #56695d;
      --green: #16a34a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0a110d;
        --ink: #e7f2ea;
        --muted: #9db3a5;
      }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(22, 163, 74, .18);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spinner-rotate .8s linear infinite;
    }
    .label {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }
    @keyframes spinner-rotate { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="loader" role="status" aria-live="polite" aria-label="Loading LearnAfrica">
    <span class="spinner" aria-hidden="true"></span>
    <p class="label">Still loading…</p>
  </main>
</body>
</html>
