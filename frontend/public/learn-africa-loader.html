<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f8f6">
  <title>LearnAfrica Loader Preview</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f8f6;
      --ink: #10241a;
      --muted: #56695d;
      --green: #16a34a;
      --gold: #d99b27;
      --orbit: rgba(22, 163, 74, .4);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --page: #0a110d;
        --ink: #e7f2ea;
        --muted: #9db3a5;
        --orbit: rgba(111, 226, 170, .45);
      }
      .logo-light { display: none; }
      .logo-dark { display: block; }
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
    }
    .visual {
      position: relative;
      display: grid;
      place-items: center;
      width: clamp(190px, 38vmin, 260px);
      aspect-ratio: 1;
    }
    .spinner {
      position: relative;
      width: clamp(82px, 16vmin, 104px);
      aspect-ratio: 1;
      border: 9px solid rgba(22, 163, 74, .16);
      border-top-color: var(--green);
      border-right-color: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 22px rgba(22, 163, 74, .2), inset 0 0 12px rgba(22, 163, 74, .09);
      animation: spinner-rotate 1.05s linear infinite;
    }
    .spinner::after {
      content: "";
      position: absolute;
      inset: 17px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(22, 163, 74, .14), transparent 72%);
    }
    .orbit {
      position: absolute;
      inset: 9px;
      border: 1px dashed var(--orbit);
      border-radius: 50%;
      animation: logo-orbit 4.8s linear infinite;
    }
    .orbit::after {
      content: "";
      position: absolute;
      inset: 12px;
      border: 1px solid rgba(217, 155, 39, .35);
      border-radius: 50%;
    }
    .satellite {
      position: absolute;
      top: 0;
      left: 50%;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      transform: translate(-50%, -50%);
      border: 1px solid rgba(22, 163, 74, .18);
      border-radius: 50%;
      background: rgba(22, 163, 74, .06);
      box-shadow: 0 2px 8px rgba(22, 163, 74, .22);
      animation: logo-counter-orbit 4.8s linear infinite;
    }
    .satellite img { width: 38px; height: 38px; object-fit: contain; }
    .logo-dark { display: none; }
    .label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: .025em;
      animation: label-breathe 1.8s ease-in-out infinite;
    }
    @keyframes spinner-rotate { to { transform: rotate(360deg); } }
    @keyframes logo-orbit { to { transform: rotate(360deg); } }
    @keyframes logo-counter-orbit {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(-360deg); }
    }
    @keyframes label-breathe { 0%, 100% { opacity: .68; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .spinner, .orbit, .satellite, .label { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="loader" role="status" aria-live="polite" aria-label="Loading LearnAfrica">
    <div class="visual" aria-hidden="true">
      <div class="orbit">
        <div class="satellite">
          <img class="logo-light" src="/logo-light.png" alt="">
          <img class="logo-dark" src="/logo-dark.png" alt="">
        </div>
      </div>
      <div class="spinner"></div>
    </div>
    <p class="label">Still loading…</p>
  </main>
</body>
</html>
