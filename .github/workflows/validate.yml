name: Validate LearnAfrica

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Chrome for browser checks
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint
      - name: Verify PDF output and geometry
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run verify:pdf
      - name: Verify certificate and badge documents
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run verify:documents
      - name: Verify mobile navigation
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run verify:mobile
      - name: Verify payment statement
        working-directory: frontend
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run verify:statement
      - name: Verify safe navigation
        working-directory: frontend
        run: npm run verify:navigation
      - name: Verify product branding
        working-directory: frontend
        run: npm run verify:branding

  backend-syntax:
    name: Backend Python syntax
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
      - name: Compile backend modules
        run: python -m compileall -q backend/app

  backend-tests:
    name: Backend test suite
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run backend tests
        working-directory: backend
        env:
          # Tests boot the real app on a throwaway SQLite database and set
          # their own per-test secrets; these just satisfy import-time reads.
          SECRET_KEY: ci-test-secret-value-not-for-production-use
          FLASK_ENV: development
          USE_POSTGRES: "false"
        run: |
          set -o pipefail
          failed=0
          for t in test_*.py; do
            echo "::group::$t"
            if ! python "$t"; then
              echo "::error file=backend/$t::$t failed"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
