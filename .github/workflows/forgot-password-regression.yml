name: Forgot Password Regression Checks

on:
  push:
    branches:
      - fix/password-reset-completion-admin-guide
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run password-reset regression suite
        run: python backend/test_password_reset_mode.py
        env:
          SECRET_KEY: test-only-secret
          DATABASE_PATH: /tmp/learnafrica-password-reset-tests.db

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
